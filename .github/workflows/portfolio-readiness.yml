name: Portfolio Readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform foundations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate all environments
        shell: bash
        run: |
          for environment in dev qa prod; do
            echo "Validating ${environment}"
            terraform -chdir="environments/${environment}" init -backend=false -reconfigure
            terraform -chdir="environments/${environment}" validate
          done

  module-tests:
    name: Native Terraform tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Run module tests
        shell: bash
        run: |
          for module in naming resource-group subnet; do
            echo "Testing modules/${module}"
            terraform -chdir="modules/${module}" init -backend=false -reconfigure
            terraform -chdir="modules/${module}" test
          done

  documentation:
    name: Documentation strict build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject sensitive tracked files
        shell: bash
        run: |
          forbidden="$(
            git ls-files |
              grep -E '(^|/)(terraform\.tfvars|[^/]+\.auto\.tfvars(\.json)?|.*\.tfstate(\..*)?|.*\.(pem|pfx|key))$' ||
              true
          )"

          if [[ -n "${forbidden}" ]]; then
            echo "Sensitive or generated files are tracked:"
            echo "${forbidden}"
            exit 1
          fi

      - name: Confirm release overlay boundaries
        shell: bash
        run: |
          test -d modules
          test -d environments/dev
          test -d environments/qa
          test -d environments/prod
          test -f SECURITY.md
          test -f mkdocs.yml
