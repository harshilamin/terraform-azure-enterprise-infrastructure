name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Initialize remote backend
        run: |
          terraform -chdir=environments/${{ inputs.environment }} init \
            -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}/platform.tfstate"

      - name: Validate
        run: terraform -chdir=environments/${{ inputs.environment }} validate

      - name: Create Terraform plan
        run: |
          terraform -chdir=environments/${{ inputs.environment }} plan \
            -input=false \
            -out=tfplan

      - name: Create readable plan
        run: |
          terraform -chdir=environments/${{ inputs.environment }} show \
            -no-color tfplan > environments/${{ inputs.environment }}/tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            environments/${{ inputs.environment }}/tfplan
            environments/${{ inputs.environment }}/tfplan.txt
          retention-days: 7
          if-no-files-found: error
