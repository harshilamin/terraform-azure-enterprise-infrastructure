name: Deploy QA or Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - qa
          - prod
      confirmation:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate deployment request
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deployment
        shell: bash
        run: |
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "Confirmation must be exactly DEPLOY."
            exit 1
          fi

  apply:
    name: Apply ${{ inputs.environment }}
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Initialize remote backend
        run: |
          terraform -chdir=environments/${{ inputs.environment }} init \
            -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}/platform.tfstate"

      - name: Validate
        run: terraform -chdir=environments/${{ inputs.environment }} validate

      - name: Plan
        run: terraform -chdir=environments/${{ inputs.environment }} plan -input=false -out=tfplan

      - name: Apply approved plan
        run: terraform -chdir=environments/${{ inputs.environment }} apply -input=false -auto-approve tfplan
