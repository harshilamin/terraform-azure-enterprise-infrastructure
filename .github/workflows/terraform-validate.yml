name: Terraform Validate

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - qa
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Initialize without backend
        run: terraform -chdir=environments/${{ matrix.environment }} init -backend=false

      - name: Validate
        run: terraform -chdir=environments/${{ matrix.environment }} validate
