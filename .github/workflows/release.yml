name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate environments
        shell: bash
        run: |
          for environment in dev qa prod; do
            terraform -chdir="environments/${environment}" init -backend=false -reconfigure
            terraform -chdir="environments/${environment}" validate
          done

      - name: Run native Terraform tests
        shell: bash
        run: |
          for module in naming resource-group subnet; do
            terraform -chdir="modules/${module}" init -backend=false -reconfigure
            terraform -chdir="modules/${module}" test
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

  release:
    name: Package and publish release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create tracked-source archive
        id: package
        shell: bash
        run: |
          archive_name="terraform-azure-enterprise-infrastructure-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --output="${archive_name}" HEAD
          sha256sum "${archive_name}" > "${archive_name}.sha256"

          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${archive_name}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Attest release archive
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.checksum_name }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.package.outputs.checksum_name }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ARCHIVE_NAME}" \
            "${CHECKSUM_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file FINAL_RELEASE_NOTES.md
